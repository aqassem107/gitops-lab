# Splits internal (mesh) traffic for transactions: 90% v1 / 10% v2.
# Sync fintech-transactions-v2-prod first and make sure the v2 pod is 2/2,
# otherwise 10% of requests will return 503 (no upstream for the v2 subset).
#
# Rollout stages: change the weights, commit/push, then Sync fintech-platform-prod
#   90/10 -> 50/50 -> 0/100 (then delete v1)
# Immediate rollback: 100/0
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: transactions
spec:
  hosts:
    - transactions
  http:
    - route:
        - destination:
            host: transactions
            subset: v1
            port:
              number: 80
          weight: 90
        - destination:
            host: transactions
            subset: v2
            port:
              number: 80
          weight: 10
