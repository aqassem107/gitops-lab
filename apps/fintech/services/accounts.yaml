image:
  repository: docker.io/ahmedqasem/fintech-accounts
  tag: "0.1.0"

env:
  # Create a Secret named db-accounts (key: url) containing:
  # postgresql+psycopg://user:pass@host:5432/accounts
  - name: DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: db-accounts
        key: url
        optional: true
