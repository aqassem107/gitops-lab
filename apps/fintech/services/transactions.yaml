image:
  repository: docker.io/ahmedqasem/fintech-transactions
  tag: "0.1.0"

env:
  - name: ACCOUNTS_URL
    value: http://accounts
  - name: NOTIFICATIONS_URL
    value: http://notifications
  # Secret named db-transactions (key: url) holding the connection URL
  - name: DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: db-transactions
        key: url
        optional: true
