# Canary version of transactions (prod only). Deployed as a separate release named transactions-v2
# but it joins the same Service (appName=transactions) and the same ServiceAccount.
appName: transactions

image:
  repository: docker.io/ahmedqasem/fintech-transactions
  tag: "0.2.0"

replicaCount: 1

service:
  enabled: false

serviceAccount:
  create: false
  name: transactions

env:
  - name: ACCOUNTS_URL
    value: http://accounts
  - name: NOTIFICATIONS_URL
    value: http://notifications
  - name: DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: db-transactions
        key: url
        optional: true
