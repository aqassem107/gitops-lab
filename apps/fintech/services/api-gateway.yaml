image:
  repository: docker.io/ahmedqasem/fintech-api-gateway
  tag: "0.1.0"

env:
  - name: ACCOUNTS_URL
    value: http://accounts
  - name: TRANSACTIONS_URL
    value: http://transactions
  # Optional: if you create a Secret named gateway-api-key (key: key), the gateway will require X-API-Key
  - name: API_KEY
    valueFrom:
      secretKeyRef:
        name: gateway-api-key
        key: key
        optional: true
