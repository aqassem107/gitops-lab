replicaCount: 1

image:
  repository: ghcr.io/stefanprodan/podinfo
  tag: "6.7.1"
  pullPolicy: IfNotPresent

containerPort: 9898

# App name used for the label (the Service selects on it). Empty = release name.
# Used for the canary: a release named transactions-v2 with appName=transactions.
appName: ""

service:
  enabled: true      # false for the canary release (the v1 Service serves both versions)
  type: ClusterIP
  port: 80

env: []

# create: creates a ServiceAccount named after the release (needed by the Istio AuthorizationPolicy)
# name: use an existing SA (for the canary: the same SA as v1)
serviceAccount:
  create: false
  name: ""

probes:
  liveness: /healthz
  readiness: /readyz

resources:
  requests:
    cpu: 20m
    memory: 32Mi
  limits:
    memory: 128Mi

# Requires metrics-server (not installed yet)
hpa:
  enabled: false
  minReplicas: 2
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70
