apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: frontend
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - env: dev
            server: https://192.168.200.11:6443
            auto: "true"
          - env: staging
            server: https://kubernetes.default.svc
            auto: "true"
          - env: prod
            server: https://192.168.200.31:6443
            auto: "false"
  template:
    metadata:
      name: 'frontend-{{.env}}'
    spec:
      project: default
      sources:
        # 1) Helm chart العام + values الخاصة بالبيئة
        - repoURL: https://github.com/aqassem107/gitops-lab.git
          targetRevision: main
          path: charts/microservice
          helm:
            releaseName: frontend
            valueFiles:
              - $values/apps/frontend/values-{{.env}}.yaml
        # 2) مرجع لملفات الـ values
        - repoURL: https://github.com/aqassem107/gitops-lab.git
          targetRevision: main
          ref: values
        # 3) Kustomize overlay الخاص بالبيئة (routing وغيره)
        - repoURL: https://github.com/aqassem107/gitops-lab.git
          targetRevision: main
          path: apps/frontend/overlays/{{.env}}
      destination:
        server: '{{.server}}'
        namespace: frontend
  # prod: sync يدوي + label للـ Istio injection. dev/staging: sync تلقائي
  templatePatch: |
    spec:
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
        {{- if eq .env "prod" }}
        managedNamespaceMetadata:
          labels:
            istio-injection: enabled
        {{- end }}
        {{- if eq .auto "true" }}
        automated:
          prune: true
          selfHeal: true
        {{- end }}
