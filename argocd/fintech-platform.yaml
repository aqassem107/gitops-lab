# Environment-specific resources (routing and security policies) come from the Kustomize overlay; one Application per environment
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: fintech-platform
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - env: dev
            server: https://192.168.200.11:6443
            auto: "true"
          - env: staging
            server: https://kubernetes.default.svc
            auto: "true"
          - env: prod
            server: https://192.168.200.31:6443
            auto: "false"
  template:
    metadata:
      name: 'fintech-platform-{{.env}}'
      labels:
        app.kubernetes.io/part-of: fintech
        env: '{{.env}}'
    spec:
      project: default
      source:
        repoURL: https://github.com/aqassem107/gitops-lab.git
        targetRevision: main
        path: apps/fintech/overlays/{{.env}}
      destination:
        server: '{{.server}}'
        namespace: fintech
  templatePatch: |
    spec:
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
        {{- if eq .env "prod" }}
        managedNamespaceMetadata:
          labels:
            istio-injection: enabled
        {{- end }}
        {{- if eq .auto "true" }}
        automated:
          prune: true
          selfHeal: true
        {{- end }}
